name: One-time repository migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Add temporary migration workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy source repository snapshot
        shell: bash
        run: |
          git clone --depth 1 --branch main https://github.com/CathrineQY/CathrineQY.github.io.git "$RUNNER_TEMP/source"
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$RUNNER_TEMP/source/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate website from CathrineQY.github.io"
          git push origin main
